schema_version: 1
bundle_id: bundle.qlj-security-metrics
book:
  title: 密码函数的安全性指标分析
  author: 李超、屈龙江、周悦
  source_pack: qlj-security-metrics-2011
  baseline_tag: research-draft-0.2.1
entry:
  name: qlj-security-metrics
  description: 基于李超、屈龙江、周悦《密码函数的安全性指标分析》的科研能力：真值表与ANF、Walsh非线性度、二元差分PN/APN、Bent及对偶、方形奇维AB、相关免疫与弹性、标量AI、配对乘积与M-M
    Bent构造。用于有限候选复算和条件核对；不执行全族分类或密码系统安全证明。
  core_principles:
  - 先读resources/usage.md与所需能力卡；输入必须有维数、完整表及位序。
  - 区分B原书事实、D独立实现/合成演练、H未证研究方向；不把有限验证称为全族证明。
  - 向量性质检查全部非零分量；几乎Bent指向量AB；PN/APN保留域特征和维数条件。
  - 本版是限定范围研究初稿：全书OCR检索与关键页核图完成，待审构造见overview，未逐一定理核验。
  - runtime为Python标准库；非恒定函数精确AI限n≤6；常函数直接AI0。not_computed与失败不同，null与0不同。
  - 参考来源为2011年专著；有关今天的最优记录与开放问题必须另外核查。
  out_of_scope:
  - 通用代码工程、任意书籍自动蒸馏、无来源的新颖性和系统安全证明。
  stop_conditions:
  - 关键域模型或输入规格不足时先补信息；超出预算明确未算。
  - 未核参数构造不进入已证明方法；向量AI先区分三定义，当前只保留参考。
